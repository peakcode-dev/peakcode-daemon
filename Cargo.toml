[package]
name = "peakcode-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Long-running supervisor and gRPC gateway for peakcode agent sessions"

[dependencies]
peakcode-core = { path = "../peakcode-core", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
